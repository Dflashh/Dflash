name: Deploy Dflash websites
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: glass-talk-studio/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci
        working-directory: glass-talk-studio
      - run: npm run build
        working-directory: glass-talk-studio
      - name: Assemble websites
        run: |
          mkdir -p _site/glass-talk
          cp index.html _site/index.html
          cp -R glass-talk-studio/dist/. _site/glass-talk/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
